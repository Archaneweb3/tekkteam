<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated Paper Analytics QA</title></head><body><main style="max-width:1200px;margin:24px auto;padding:12px"><h1>Isolated Analytics QA</h1><p>Test-only engine receipts · no real agent or wallet changes</p><div style="display:flex;gap:10px"><button class="tw-button" data-view="populated">Populated</button><button class="tw-button" data-view="empty">Empty</button><button class="tw-button" data-view="error">API error</button></div><div id="analytics"></div></main><script type="module">
import {mountAnalytics} from '../public/app/performance-ui.js';
const html=await(await fetch('/index.html')).text(),dom=new DOMParser().parseFromString(html,'text/html');await Promise.all([...dom.querySelectorAll('link[rel=stylesheet]')].map(link=>new Promise(resolve=>{const copy=link.cloneNode();copy.onload=resolve;copy.onerror=resolve;document.head.append(copy);})));const fixture=await(await fetch('/tests/analytics-fixture.json')).json();let view='populated';const mounted=mountAnalytics(document.querySelector('#analytics'),fixture.agent,{request:async()=>{if(view==='error')throw Error('Isolated API failure');return fixture[view];}});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;mounted.refresh();});
</script></body></html>
