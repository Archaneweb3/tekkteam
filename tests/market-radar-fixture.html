<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Radar — isolated UI QA</title></head><body><main style="max-width:1120px;margin:24px auto;padding:16px"><p>ISOLATED QA FIXTURE · Synthetic inputs, actual Paper engine outputs · No wallets</p><div id="qa-controls"><button data-status="OFFLINE">Offline</button><button data-status="WATCHING">Watching</button><button data-status="PAUSED">Paused</button><button data-status="STALE_DATA">Stale</button><button data-status="ERROR">Error</button></div><div id="radar-root"></div></main><script type="module">
import {createElement,Check,X,Minus,Box} from 'lucide';
import {mountMarketRadar} from '../public/app/market-radar-ui.js';
const html=await (await fetch('/index.html')).text();const dom=new DOMParser().parseFromString(html,'text/html');await Promise.all([...dom.querySelectorAll('link[rel=stylesheet]')].map(link=>new Promise(resolve=>{const copy=link.cloneNode();copy.onload=resolve;copy.onerror=resolve;document.head.append(copy);})));window.TekkworkIcon=name=>createElement(({check:Check,close:X,minus:Minus})[name]||Box,{width:18,height:18,'aria-hidden':true}).outerHTML;
const fixture=await(await fetch('/tests/market-radar-fixture.json')).json();let status='WATCHING';const request=async path=>path.endsWith('/radar')?{...fixture.radar,status,opportunities:status==='OFFLINE'?[]:fixture.radar.opportunities}:{agentId:fixture.agent.id,decisions:fixture.decisions.filter(d=>{const f=new URL('http://fixture/'+path).searchParams.get('filter');return f==='all'||(f==='trades'?['BUY','SELL'].includes(d.finalDecision):f==='risk'?d.finalDecision==='REJECTED':d.finalDecision==='SKIPPED');})};
const mounted=mountMarketRadar(document.querySelector('#radar-root'),fixture.agent,{request,onStart:()=>{status='WATCHING';mounted.refresh();}});document.querySelector('#qa-controls').onclick=e=>{if(e.target.dataset.status){status=e.target.dataset.status;mounted.refresh();}};
</script></body></html>
