# PREPARED ONLY: include inside the verified TEKKTEAM HTTPS server after approval.
# Replace the root with its confirmed DATA_DIR/pump-metadata-site/public path.
# This does not configure a domain, TLS, publisher credentials or deployment.
location ~ "^/[A-Za-z0-9_-]{43}$" {
    root /var/lib/tekkteam/pump-metadata-site/public;
    try_files $uri =404;
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
}
location ~ "^/metadata/agents/[A-Za-z0-9_-]+/[a-f0-9]{64}\.png$" {
    root /var/lib/tekkteam/pump-metadata-site/public;
    try_files $uri =404;
    default_type image/png;
    add_header X-Content-Type-Options nosniff always;
}
